<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Employee form</title>
</head>

<body>

<nav class="app-navbar">
    <div class="container">
        <a class="brand" th:href="@{/employees}">
            <i class="fas fa-users"></i> Employee Directory
        </a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <div>
            <h2 th:text="${employee.id} != null ? 'Update the employee' : 'Create an employee'"></h2>
            <div class="subtitle">Fill in the employee details below</div>
        </div>
    </div>

    <form th:action="${employee.id} != null ? @{/employees/{id}(id=${employee.id})} : @{/employees}"
          th:object="${employee}" method="post">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title"><i class="fas fa-user-pen"></i> Information</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First name</label>
                        <input type="text" class="form-control" id="firstName" th:field="*{firstName}"
                               placeholder="First name is required" required>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last name</label>
                        <input type="text" class="form-control" id="lastName" th:field="*{lastName}"
                               placeholder="Last name is required" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label">Date of birth</label>
                        <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="jobTitle" class="form-label">Job title</label>
                        <select class="form-select" id="jobTitle" th:field="*{jobTitle}" required>
                            <option value="" disabled selected>Choose the job title</option>
                            <option th:each="title : ${jobTitles}"
                                    th:value="${title}"
                                    th:text="${title}"></option>

                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}"
                               placeholder="Email's required" required>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone number</label>
                        <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                               placeholder="Phone number's required">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="salary" class="form-label">Salary</label>
                        <input type="number" step="0.01" class="form-control" id="salary" th:field="*{salary}"
                               placeholder="Salary's required" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label d-block">Type of employment</label>
                        <div class="radio-group">
                            <div class="form-check" th:each="type : ${employmenntType}">
                                <input class="form-check-input" type="radio"
                                       th:field="*{employmentType}"
                                       th:value="${type}"
                                       th:id="${'et-' + type}">
                                <label class="form-check-label" th:for="${'et-' + type}" th:text="${type}"></label>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="card-footer">
                <a th:href="@{/employees}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to list
                </a>
                <button type="submit" class="btn btn-primary"
                        th:text="${employee.id} != null ? 'Update the employee' : 'Create the employee'"></button>
            </div>
        </div>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

</body>
</html>
