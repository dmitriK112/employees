<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Employee Directory</title>
</head>

<body>

<nav class="app-navbar">
    <div class="container">
        <a class="brand" th:href="@{/employees}">
            <i class="fas fa-users"></i> Employee Directory
        </a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <div>
            <h2>List of Employees</h2>
            <div class="subtitle">Click a row to view and edit an employee</div>
        </div>
        <a th:href="@{/employees/create}" class="btn btn-primary btn-add">
            <i class="fas fa-plus"></i> New employee
        </a>
    </div>

    <div class="table-wrapper">
        <table class="table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Job title</th>
                <th>Type of employment</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}"
                class="row-link"
                th:onclick="|window.location.href='@{/employees/{id}(id=${employee.id})}'|">
                <td th:text="${employee.firstName} + ' ' + ${employee.lastName}"></td>
                <td th:text="${employee.jobTitle}"></td>
                <td th:text="${employee.employmentType}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="3">
                    <div class="empty-state">
                        <i class="fas fa-user-slash d-block"></i>
                        No employees yet. Add the first one.
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

</body>
</html>
