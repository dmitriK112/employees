<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Employee Details</title>
</head>

<body>

<nav class="app-navbar">
    <div class="container">
        <a class="brand" th:href="@{/employees}">
            <i class="fas fa-users"></i> Employee Directory
        </a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <div>
            <h2 th:text="${employee.firstName} + ' ' + ${employee.lastName}">Employee Details</h2>
            <div class="subtitle" th:text="${employee.jobTitle}">Job title</div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title"><i class="fas fa-id-card"></i> Information about the employee</h5>

            <div class="detail-row">
                <span class="label">Name</span>
                <span class="value" th:text="${employee.firstName}"></span>
            </div>
            <div class="detail-row">
                <span class="label">Surname</span>
                <span class="value" th:text="${employee.lastName}"></span>
            </div>
            <div class="detail-row">
                <span class="label">Date of birth</span>
                <span class="value" th:text="${#temporals.format(employee.birthDate, 'dd. MM. yyyy')}"></span>
            </div>
            <div class="detail-row">
                <span class="label">Email</span>
                <span class="value" th:text="${employee.email}"></span>
            </div>
            <div class="detail-row">
                <span class="label">Phone number</span>
                <span class="value" th:text="${employee.phone}"></span>
            </div>
            <div class="detail-row">
                <span class="label">Job title</span>
                <span class="value" th:text="${employee.jobTitle}"></span>
            </div>
            <div class="detail-row">
                <span class="label">Salary</span>
                <span class="value" th:text="${employee.salary}"></span>
            </div>
            <div class="detail-row">
                <span class="label">Type of employment</span>
                <span class="value" th:text="${employee.employmentType}"></span>
            </div>
        </div>
        <div class="card-footer">
            <a th:href="@{/employees}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to the list
            </a>
            <a th:href="@{'/employees/' + ${employee.id} + '/edit'}" class="btn btn-primary">
                <i class="fas fa-edit"></i> Update
            </a>
            <form th:action="@{'/employees/' + ${employee.id} + '/delete'}" method="post" class="d-inline ms-auto">
                <button type="submit" class="btn btn-danger" title="Delete"
                        onclick="return confirm('Are you sure?');">
                    <i class="fas fa-trash"></i> Delete
                </button>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

</body>
</html>
